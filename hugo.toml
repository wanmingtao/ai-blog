baseURL = "https://wanmingtao.github.io/ai-blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "AI 探索者"
theme = "PaperMod"
paginate = 6

[params]
  env = "production"
  description = "探索人工智能前沿技术，分享AI领域的深度思考与实践心得"
  keywords = ["AI", "人工智能", "机器学习", "深度学习", "大模型", "LLM"]
  author = "wanmingtao"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  [params.homeInfoParams]
    Title = ""
    Content = ""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wanmingtao"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:wanmingtao@users.noreply.github.com"

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = true

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.profileMode]
    enabled = true
    title = "🤖 AI 探索者"
    subtitle = "探索人工智能的无限可能 · 用代码改变世界"
    imageUrl = "https://api.dicebear.com/7.x/bottts-neutral/svg?seed=ai-explorer&backgroundColor=0a5c36"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "AI Explorer"

    [[params.profileMode.buttons]]
      name = "📝 最新文章"
      url = "/posts/"

    [[params.profileMode.buttons]]
      name = "🏷️ 标签云"
      url = "/tags/"

    [[params.profileMode.buttons]]
      name = "👤 关于我"
      url = "/about/"

    [[params.profileMode.buttons]]
      name = "☕ 请我喝咖啡"
      url = "/donate/"

  [params.label]
    text = "AI 探索者"
    icon = "🤖"
    iconHeight = 35

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  identifier = "posts"
  name = "📝 文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "🏷️ 标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "📂 分类"
  url = "/categories/"
  weight = 30

[[menu.main]]
  identifier = "archives"
  name = "📚 归档"
  url = "/archives/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "🔍 搜索"
  url = "/search/"
  weight = 50

[[menu.main]]
  identifier = "about"
  name = "👤 关于"
  url = "/about/"
  weight = 60

[[menu.main]]
  identifier = "donate"
  name = "☕ 打赏"
  url = "/donate/"
  weight = 70
